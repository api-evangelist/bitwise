aid: bitwise
name: Bitwise
description: >-
  Bitwise Asset Management is a crypto-focused investment manager (founded 2017,
  offices in San Francisco, New York, London, and Frankfurt) offering crypto
  index funds, ETFs, separately managed accounts, private funds, and staking
  products across 70+ vehicles including the Bitwise 10 Crypto Index (BITW) and
  spot Bitcoin (BITB) and Ethereum (ETHW) ETFs. Bitwise publishes a read-only
  market-data API for its indexes, ETFs, and fund data via a public Postman
  developer portal, covering index metadata, historical daily index values,
  index constituents (prices/supplies/weights), and per-fund data (NAV, AUM,
  holdings, crypto-per-share, performance). API keys are issued on request. This
  profile was enriched by the API Evangelist pipeline from the provider's public
  developer surface.
